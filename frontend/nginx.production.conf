# TextGuard 生产环境 Nginx 配置（HTTP 模式，默认）
# 全 host 网络模式：nginx 直接监听宿主机端口 3022(HTTP)
# 后端代理到 127.0.0.1:3020（同在宿主机网络栈）
#
# 如需启用 HTTPS，请参考 nginx.production.ssl.conf

server {
    listen 3022;
    server_name _;
    server_tokens off;

    # 安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 上传大小限制
    client_max_body_size 50m;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查端点
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
        access_log off;
    }

    # 后端 API 反向代理（直接走 localhost，无需跨 Docker 网络）
    location /api/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 上传文件代理（^~ 保证优先于静态资源缓存的regex匹配）
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    keepalive_timeout 75s;
}
