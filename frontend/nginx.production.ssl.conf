# TextGuard 生产环境 Nginx 配置（HTTPS 模式）
# 全 host 网络模式：nginx 直接监听宿主机端口 3022(HTTPS) / 3080(HTTP)
# 后端代理到 127.0.0.1:3020（同在宿主机网络栈）
#
# 启用方法：
# 1. 将 SSL 证书放到 frontend/ssl/ 目录下
# 2. 修改下方 ssl_certificate / ssl_certificate_key 路径
# 3. 构建时用此文件替换 nginx.production.conf：
#    在 Dockerfile 中把 COPY nginx.production.conf 改为 COPY nginx.production.ssl.conf

# HTTP -> HTTPS 重定向（监听 3080 端口）
server {
    listen 3080;
    server_name _;

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host:3022$request_uri;
    }
}

# HTTPS 主站（监听 3022 端口）
server {
    listen 3022 ssl http2;
    server_name _;
    server_tokens off;

    # SSL 证书（请替换为你自己的证书路径）
    ssl_certificate /etc/nginx/ssl/your-domain.crt;
    ssl_certificate_key /etc/nginx/ssl/your-domain.key;

    # SSL 安全参数
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 上传大小限制
    client_max_body_size 50m;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查端点
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
        access_log off;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 上传文件代理
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    keepalive_timeout 75s;
}
